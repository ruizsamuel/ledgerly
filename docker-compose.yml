services:
  server:
    image: ledgerly-server:latest
    build:
      context: ./server
    restart: on-failure
    environment:
      - CORS_ORIGIN=${CLIENT_URL}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    ports:
      - "5000:5000"
    command: npm run dev

  client:
    image: ledgerly-client:latest
    build:
      context: ./client
    environment:
      - SERVER_PROXY_TARGET=${SERVER_PROXY_TARGET:-http://server:5000}
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    command: npm run start

  mongo:
    image: mongo:5.0.2
    container_name: mongo_container
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./data-dev:/data/db
      - ./db-init.sh:/usr/local/bin/db-init.sh:ro
    entrypoint: ["/usr/local/bin/db-init.sh"]

volumes:
  client_node_modules:
  server_node_modules:
