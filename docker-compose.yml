services:
  server:
    build:
      context: ./server
    environment:
      - CORS_ORIGIN=${CLIENT_URL}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    command: npm run dev

  client:
    build:
      context: ./client
      args:
        - API_URL=${SERVER_URL}
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/dist
      - /app/src/environments
    ports:
      - "4200:4200"
    command: npm run start

  mongo:
    image: mongo:5.0.2
    container_name: mongo_container
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./data:/data/db
      - ./db-init.sh:/usr/local/bin/db-init.sh:ro
    entrypoint: ["/usr/local/bin/db-init.sh"]
