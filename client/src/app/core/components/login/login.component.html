<div class="w-screen h-screen flex flex-col justify-center items-center">
  <app-logo size="extralarge" class="mb-10" />
  <div class="w-xs py-2 px-6 flex flex-col items-center">
    <div class="tabs tabs-border w-full flex justify-center mb-3" i18n="@@createAdminUser">
      <input type="radio" name="tabs" class="tab text-xl flex-1" i18n-aria-label="{@@login}" aria-label="Login" checked (click)="selectedTab.set('login')"/>
      <input type="radio" name="tabs" class="tab text-xl flex-1" i18n-aria-label="{@@register}" aria-label="Register" (click)="selectedTab.set('register')"/>
    </div>

    <app-form
      [fields]="formFields()"
      [submitButtonText]="submitLabel()"
      title=""
      [cancellable]="false"
      (formSubmit)="handleSubmit($event)" />
  </div>
</div>
