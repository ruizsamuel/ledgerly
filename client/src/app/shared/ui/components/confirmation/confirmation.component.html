<div class="bg-base-200 border-base-300 rounded-box w-xs border p-5">
  <h2 class="text-2xl font-bold mb-4" i18n="@@confirmationTitle">Confirmation</h2>
  <p class="mb-6">{{ message() }}</p>
  <div class="flex justify-end space-x-2">
    @if (isLoading()) {
    <span class="loading loading-spinner loading-md"></span>
    }
    <button
      class="btn btn-error"
      (click)="isLoading.set(true); onResult.emit(false)"
      [disabled]="isLoading()"
      i18n="@@cancelAction">
      Cancel
    </button>
    <button
      class="btn btn-primary"
      (click)="isLoading.set(true); onResult.emit(true)"
      [disabled]="isLoading()"
      i18n="@@confirmAction">
      Confirm
    </button>
  </div>
</div>
