<div class="bg-base-200 border-base-300 rounded-box w-xs border p-5">
  <h2 class="text-2xl font-bold mb-4" i18n="@@confirmationTitle">Confirmation</h2>
  <p class="mb-6">{{ message() }}</p>
  <div class="flex justify-end space-x-2">
    <button class="btn btn-error" (click)="onResult.emit(false)" i18n="@@cancelAction">Cancel</button>
    <button class="btn btn-primary" (click)="onResult.emit(true)" i18n="@@confirmAction">Confirm</button>
  </div>
</div>
