<app-page-title
  [title]="pageTitle"
  [description]="pageDescription"
/>

<div class="container mx-auto py-10 px-5">
  <div class="mb-5">
    <button class="btn btn-primary" [disabled]="accountsResource.value()?.content?.length === 0" (click)="showForm()">
      <span class="material-symbols-outlined">add</span>
      <span i18n="@@addTransaction">Add Transaction</span>
    </button>
  </div>

  @if (!isLoading()) {
  <app-transaction-list />
  }
</div>
