<div class="container mx-auto py-10 px-5">
  <h1 class="text-2xl font-bold mb-4" i18n="@@summary" (click)="transactionResource.reload()">Summary</h1>
  <div class="flex flex-wrap">
    @if (!transactionResource.isLoading()) {
    <app-line-chart
      [series]="transactionHelper.previousYearComparativeChart(transactionResource.value()?.content || [])"
      [categories]="transactionHelper.MONTHS"
      class="flex-1 min-w-[45vw] mb-4"
    />
    }
    @else {
    <div class="flex-1 min-w-[45vw] mb-4 flex items-center justify-center">
      <app-loading />
    </div>
    }
    <div class="flex flex-col lg:py-10 w-full lg:w-auto">
      <div class="stats bg-base-100 border-base-300 border mb-4">
        <div class="stat">
          <div class="stat-title" i18n="@@yourMoney">Your Money</div>
          <div class="stat-value text-primary">{{ totalBalance() | currency }}</div>
        </div>

        <div class="stat">
          <div class="stat-title" i18n="@@thisMonthBalance">This Month Balance</div>
          <div class="stat-value">{{ thisMonthBalance() | currency }}</div>
        </div>
      </div>
      <div class="flex gap-3 mb-10 justify-center">
        <button type="button" class="btn btn-success" (click)="handleAddIncome()">
          <span class="material-symbols-outlined">add</span>
          <span i18n="@@income">Income</span>
        </button>
        <button type="button" class="btn btn-error" (click)="handleAddExpense()">
          <span class="material-symbols-outlined">remove</span>
          <span i18n="@@expense">Expense</span>
        </button>
        <button type="button" class="btn btn-primary" (click)="handleTransfer()">
          <span class="material-symbols-outlined">compare_arrows</span>
          <span i18n="@@transfer">Transfer</span>
        </button>
      </div>
    </div>
  </div>
  <h1 class="text-2xl font-bold mb-4" i18n="@@recentTransactions">Recent Transactions</h1>
  <app-table
    [data]="transactionResource.value()?.content?.slice(0,10) ?? []"
    [config]="transactionHelper.tableBasic()"
    [class.hidden]="transactionResource.isLoading()"
  />
  @if (transactionResource.isLoading()) {
  <div class="flex items-center justify-center">
    <app-loading />
  </div>
  }
</div>
